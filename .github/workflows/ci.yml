name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify PR command evidence
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "::error::PR description is empty. Pull requests must include evidence of command execution (e.g., citing 'bun run gate' or test/lint execution)."
            exit 1
          fi

          if ! printf '%s\n' "$PR_BODY" | grep -iE '(^|[[:space:]`$])(bun run [[:alnum:]_:-]+|bun (test|lint)|bunx nx [[:alnum:]_:-]+)([[:space:]`]|$)' > /dev/null; then
            echo "::error::PR description does not include evidence of command execution. Please update the PR description to include evidence of executed commands (e.g., citing 'bun run gate' or test/lint execution)."
            exit 1
          fi
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Derive affected base and head
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps --only-shell chromium
      - name: Gate
        run: bun run gate
